<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>从喵翻译</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <h1 data-i18n="app">从喵翻译</h1>
          <p id="status">正在连接本机服务</p>
        </div>
        <nav class="sidebar-nav" aria-label="页面">
          <button class="nav-item" type="button" data-page="translate" aria-current="page" data-i18n="nav-translate">翻译</button>
          <button class="nav-item" type="button" data-page="files" data-i18n="nav-files">文件</button>
          <button class="nav-item" type="button" data-page="minecraft" data-i18n="nav-minecraft">模组汉化</button>
          <button class="nav-item" type="button" data-page="history" data-i18n="nav-history">历史</button>
          <button class="nav-item" type="button" data-page="vocab" data-i18n="nav-vocab">生词本</button>
          <button class="nav-item" type="button" data-page="settings" data-i18n="nav-settings">设置</button>
        </nav>
        <div class="sidebar-footer">
          <button id="theme-toggle" class="nav-item" type="button" aria-pressed="false">黑夜模式</button>
        </div>
      </aside>

      <div class="content">
        <section id="page-translate" class="page translate-page">
          <header class="page-header">
            <h2 data-i18n="nav-translate">翻译</h2>
            <p id="shortcut-hint" class="shortcut-hint"></p>
          </header>
          <div class="translate-toolbar">
            <label class="lang">
              <span data-i18n="source">原文</span>
              <select id="source"></select>
            </label>
            <button id="swap" class="subtle" type="button" data-i18n="swap">交换</button>
            <label class="lang">
              <span data-i18n="target">译文</span>
              <select id="target"></select>
            </label>
            <span class="toolbar-gap"></span>
            <button id="speak-source" class="subtle" type="button" data-i18n="speak">朗读</button>
            <button id="translate" class="accent" type="button" data-i18n="translate">翻译</button>
          </div>
          <div class="desk">
            <section class="pane">
              <textarea id="source-text" placeholder="输入或粘贴要翻译的文字"></textarea>
            </section>
            <section class="pane pane-output">
              <div id="dict" class="dict" hidden></div>
              <div id="results" class="results" aria-live="polite"></div>
            </section>
          </div>
        </section>

        <section id="page-files" class="page" hidden>
          <header class="page-header">
            <h2 data-i18n="nav-files">文件</h2>
          </header>
          <div class="page-body">
            <label data-i18n="file-path-label">文件路径
              <input id="file-path" type="text" placeholder="把 txt、md、docx、epub 或 pdf 拖到这里，或粘贴路径" />
            </label>
            <div class="row">
              <label data-i18n="engine">引擎 <select id="file-engine"></select></label>
              <label data-i18n="target">译文 <select id="file-target"></select></label>
              <label data-i18n="output-mode">输出
                <select id="file-mode">
                  <option value="translated" data-i18n="mode-translated">只输出译文</option>
                  <option value="bilingual" data-i18n="mode-bilingual">原文下接译文</option>
                </select>
              </label>
            </div>
            <div class="row">
              <button id="file-start" class="accent" type="button" data-i18n="file-start">开始翻译</button>
              <button id="file-cancel" class="subtle" type="button" data-i18n="cancel">取消</button>
              <button id="file-resume" class="subtle" type="button" data-i18n="resume">继续</button>
              <button id="file-open" class="subtle" type="button" data-i18n="open-folder">打开输出文件夹</button>
            </div>
            <progress id="file-progress" max="1" value="0"></progress>
            <p id="file-report" class="meta"></p>
          </div>
        </section>

        <section id="page-minecraft" class="page" hidden>
          <header class="page-header">
            <h2 data-i18n="nav-minecraft">模组汉化</h2>
          </header>
          <div class="page-body">
            <label data-i18n="instance-path">整合包目录
              <input id="mc-path" type="text" placeholder=".minecraft 或启动器实例目录" />
            </label>
            <div class="row">
              <label data-i18n="engine">引擎 <select id="mc-engine"></select></label>
              <label data-i18n="game-version">游戏版本
                <select id="mc-version">
                  <option value="1.20.1">1.20.1</option>
                  <option value="1.20.4">1.20.4</option>
                  <option value="1.21" selected>1.21</option>
                  <option value="1.21.4">1.21.4</option>
                  <option value="1.21.8">1.21.8</option>
                </select>
              </label>
            </div>
            <div class="row">
              <button id="mc-preview" class="subtle" type="button" data-i18n="preview">预览</button>
              <button id="mc-start" class="accent" type="button" data-i18n="mc-start">开始汉化</button>
              <button id="mc-cancel" class="subtle" type="button" data-i18n="cancel">取消</button>
              <button id="mc-resume" class="subtle" type="button" data-i18n="resume">继续</button>
              <button id="mc-open" class="subtle" type="button" data-i18n="open-folder">打开输出文件夹</button>
            </div>
            <label class="wide" data-i18n="mc-glossary">这次额外使用的术语，每行原文=译文
              <textarea id="mc-glossary" rows="4" placeholder="Nether=下界"></textarea>
            </label>
            <progress id="mc-progress" max="1" value="0"></progress>
            <p id="mc-status" class="meta"></p>
            <div id="mc-report" class="list"></div>
          </div>
        </section>

        <section id="page-history" class="page" hidden>
          <header class="page-header">
            <h2 data-i18n="nav-history">历史</h2>
          </header>
          <div class="page-body">
            <div class="row">
              <input id="history-query" type="search" placeholder="搜索历史" data-i18n-placeholder="history-search-placeholder" />
              <select id="history-target">
                <option value="" data-i18n="history-any-target">全部目标语言</option>
              </select>
              <button id="history-search" class="subtle" type="button" data-i18n="search">搜索</button>
              <button id="history-clear" class="subtle" type="button" data-i18n="clear">清空</button>
            </div>
            <div id="history-list" class="list"></div>
          </div>
        </section>

        <section id="page-vocab" class="page" hidden>
          <header class="page-header">
            <h2 data-i18n="nav-vocab">生词本</h2>
          </header>
          <div class="page-body">
            <div class="row">
              <button id="vocab-csv" class="subtle" type="button">导出 CSV</button>
              <button id="vocab-anki" class="subtle" type="button">导出 Anki</button>
            </div>
            <div id="vocab-list" class="list"></div>
          </div>
        </section>

        <form id="page-settings" class="page settings" hidden>
          <header class="page-header">
            <h2 data-i18n="nav-settings">设置</h2>
          </header>
          <div class="tabs" role="tablist">
            <button type="button" data-tab="general" aria-selected="true">常规</button>
            <button type="button" data-tab="engines">翻译引擎</button>
            <button type="button" data-tab="shortcuts">快捷键</button>
            <button type="button" data-tab="permissions">权限</button>
            <button type="button" data-tab="about">关于</button>
          </div>
          <div class="settings-body">
            <section data-panel="general">
              <label class="check"><input id="swap-when-same" type="checkbox" /> <span data-i18n="swap-when-same">检测到原文就是目标语言时，自动改译成另一种语言</span></label>
              <label class="check"><input id="watch-clipboard" type="checkbox" /> <span data-i18n="watch-clipboard">复制文字后自动翻译</span></label>
              <label class="check"><input id="auto-translate" type="checkbox" /> <span data-i18n="auto-translate">停下输入后自动翻译</span></label>
              <label class="check"><input id="auto-copy" type="checkbox" /> <span data-i18n="auto-copy">自动复制第一条译文</span></label>
              <label class="check"><input id="launch-at-login" type="checkbox" /> <span data-i18n="launch-at-login">开机启动</span></label>
              <label class="check"><input id="show-tray" type="checkbox" /> <span data-i18n="show-tray">显示托盘图标</span></label>
              <label><span data-i18n="ui-language">界面语言</span>
                <select id="ui-language">
                  <option value="zh">中文</option>
                  <option value="en">English</option>
                </select>
              </label>
              <label><span data-i18n="theme">主题</span>
                <select id="theme-choice">
                  <option value="system" data-i18n="theme-system">跟随系统</option>
                  <option value="light" data-i18n="theme-light">浅色</option>
                  <option value="dark" data-i18n="theme-dark">深色</option>
                </select>
              </label>
              <label><span data-i18n="proxy">代理</span>
                <input id="proxy" type="text" placeholder="http://127.0.0.1:7890" />
              </label>
              <label><span data-i18n="job-concurrency">文件翻译并发</span>
                <input id="job-concurrency" type="number" min="1" max="8" value="3" />
              </label>
              <h3 data-i18n="prompt-title">翻译风格</h3>
              <label class="wide"><span data-i18n="prompt">文件翻译、模组汉化和大模型引擎都会带上这段要求</span>
                <textarea id="prompt" rows="3" placeholder="使用简洁的书面语"></textarea>
              </label>
              <h3 data-i18n="glossary-title">术语表</h3>
              <label class="wide">每行一条，格式为原文=译文
                <textarea id="glossary" rows="6" placeholder="cache=缓存"></textarea>
              </label>
            </section>
            <section data-panel="engines" hidden>
              <p class="meta">没有钥匙的网页接口是非官方接口，可能失效。需要钥匙的引擎只有填好后才会启用。</p>
              <div id="engine-list" class="engine-list"></div>
              <button id="clear-cache" class="subtle" type="button">清空翻译缓存</button>
            </section>
            <section data-panel="shortcuts" hidden>
              <p class="meta">点选输入框后直接按下组合键。五个快捷键不能相同。</p>
              <p id="wayland-shortcut-hint" class="meta" hidden></p>
              <label>截图翻译 <input id="shortcut-screenshot" data-shortcut type="text" readonly /></label>
              <label>划词翻译 <input id="shortcut-selection" data-shortcut type="text" readonly /></label>
              <label>输入翻译 <input id="shortcut-input" data-shortcut type="text" readonly /></label>
              <label>替换翻译 <input id="shortcut-replace" data-shortcut type="text" readonly /></label>
              <label>静默识别 <input id="shortcut-silent" data-shortcut type="text" readonly /></label>
            </section>
            <section data-panel="permissions" hidden>
              <div id="permission-list" class="list"></div>
            </section>
            <section data-panel="about" hidden>
              <p id="about-version"></p>
              <p id="data-dir"></p>
              <div class="row">
                <button id="open-logs" class="subtle" type="button">打开日志目录</button>
                <button id="open-data" class="subtle" type="button">打开数据目录</button>
                <button id="check-update" class="subtle" type="button">检查更新</button>
              </div>
            </section>
            <div class="settings-actions">
              <button id="save-settings" class="accent" type="submit">保存</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div id="onboarding" class="modal" hidden>
      <form class="modal-card">
        <h2 id="onboard-title">开始使用</h2>
        <p id="onboard-copy"></p>
        <div id="onboard-body"></div>
        <div class="row">
          <button id="onboard-back" class="subtle" type="button">上一步</button>
          <button id="onboard-next" class="accent" type="button">下一步</button>
        </div>
      </form>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
