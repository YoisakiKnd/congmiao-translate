<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>从喵翻译</title>
    <style>
      body {
        margin: 0;
        width: 320px;
        padding: 16px;
        color: #1a1a1a;
        background: #f3f3f3;
        font-family: "Segoe UI Variable", "Segoe UI", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      }
      h1 { margin: 0 0 12px; font-size: 20px; font-weight: 600; line-height: 28px; }
      label { display: block; margin-bottom: 10px; font-size: 12px; color: #5d5d5d; }
      select, textarea, button { width: 100%; font: inherit; color: inherit; }
      select, textarea {
        margin-top: 4px;
        border: 1px solid rgba(0, 0, 0, 0.0578);
        border-bottom-color: rgba(0, 0, 0, 0.162);
        border-radius: 4px;
        background: #fff;
      }
      select { height: 32px; padding: 0 8px; }
      textarea { min-height: 96px; padding: 8px; resize: vertical; line-height: 20px; }
      button {
        height: 32px;
        border: 0;
        border-radius: 4px;
        background: #005fb8;
        color: #fff;
        cursor: pointer;
      }
      button:hover { background: #0067c0; }
      #result { white-space: pre-wrap; line-height: 20px; min-height: 20px; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>从喵翻译</h1>
    <label>
      目标语言
      <select id="target">
        <option value="zh">中文</option>
        <option value="en">英语</option>
        <option value="ja">日语</option>
        <option value="ko">韩语</option>
      </select>
    </label>
    <label>
      原文
      <textarea id="text" placeholder="输入要翻译的文字"></textarea>
    </label>
    <button id="go" type="button">翻译</button>
    <p id="result"></p>
    <script src="popup.js"></script>
  </body>
</html>
